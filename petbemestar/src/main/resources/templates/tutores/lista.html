<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>Tutores</title>
	<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
	<header>
		<img src="/img/logo-pet-bem-estar.jpg" alt="logo Pet Bem-Estar" class="logo">
	</header>
	<h1>Tutores Cadastrados</h1>
	<p th:if="${session.usuarioLogado}">
		Usuario: <span th:text="${session.usuarioLogado.nomeUsuario}">Marlene</span>
			<a href="/sair">Sair</a>
	</p>
	<p class="erro" th:if="${erro}" th:text="${erro}"></p>
	<table border="1">
		<thead>
			<tr>
				<th>Nome</th>
				<th>Telefone</th>
				<th>Email</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="t : ${tutores}">
				<td>
					<a th:href="@{/paginas/tutores/{id}(id=${t.id})}" th:text="${t.nome}"></a>
				</td>
				<td th:text="${t.telefone}"></td>
				<td th:text="${t.email}"></td>
				<td><a th:href="@{/paginas/tutores/{id}/editar(id=${t.id})}">Editar</a>
					<form th:action="@{/paginas/tutores/{id}/remover(id=${t.id})}" method="post" style="display: inline; margin-left: 10px;">
						<button type="submit">Remover</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
